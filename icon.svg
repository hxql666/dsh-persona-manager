<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Persona Manager">
  <defs>
    <linearGradient id="pm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="pm-figure" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#e0e7ff" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- rounded tile -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#pm-bg)"/>

  <!-- back persona: offset silhouette -->
  <g transform="translate(8 9) scale(0.82)" opacity="0.42">
    <circle cx="24" cy="16" r="9" fill="#ffffff"/>
    <path d="M8 54c0-11 7.2-18 16-18s16 7 16 18z" fill="#ffffff"/>
  </g>

  <!-- front persona: main silhouette -->
  <g transform="translate(20 13) scale(0.74)">
    <circle cx="24" cy="16" r="9.5" fill="url(#pm-figure)"/>
    <path d="M7 54c0-11.4 7.6-18.5 17-18.5S41 42.6 41 54z" fill="url(#pm-figure)"/>
  </g>

  <!-- switch knob: the "switch freely" cue -->
  <circle cx="46" cy="46" r="10.5" fill="#0f172a" fill-opacity="0.28"/>
  <circle cx="46" cy="46" r="8.6" fill="#ffffff"/>
  <path d="M41.6 46.2l2.9 3.1 5.6-6.2" fill="none" stroke="#4f46e5" stroke-width="2.1"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
